<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ObyLogin Browser</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1b2e;--bg2:#12132a;--surface:#222345;--surface2:#2a2c52;
  --border:#353766;--border2:#454988;
  --text:#e8eaf6;--text-muted:#9499c3;--text-faint:#6b70a0;
  --accent:#8b5cf6;--accent-h:#a78bfa;--accent-bg:rgba(139,92,246,.15);
  --url-bg:#12132a;--url-focus:#8b5cf6;
  --close-hover:#ef4444;
  --green:#22c55e
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg2);color:var(--text);overflow:hidden;user-select:none;-webkit-app-region:drag}
button,input{-webkit-app-region:no-drag}

.tab-bar{display:flex;align-items:flex-end;height:40px;padding:4px 8px 0 80px;background:var(--bg2);gap:2px}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px 10px 0 0;background:transparent;border:none;color:var(--text-muted);font-size:12px;font-weight:500;cursor:pointer;max-width:240px;min-width:60px;flex:0 1 200px;transition:all .15s}
.tab:hover{background:var(--surface);color:var(--text)}
.tab.active{background:var(--bg);color:var(--text)}
.tab-favicon{width:16px;height:16px;border-radius:3px;flex-shrink:0;display:grid;place-items:center;font-size:12px}
.tab-favicon img{width:16px;height:16px;border-radius:3px}
.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.tab-close{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:none;background:none;color:var(--text-faint);cursor:pointer;font-size:13px;flex-shrink:0;padding:0;line-height:1;transition:all .15s}
.tab-close:hover{background:var(--close-hover);color:#fff}
.tab-new{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:20px;margin-left:4px;flex-shrink:0;align-self:center;transition:all .15s}
.tab-new:hover{background:var(--surface);color:var(--text)}

.toolbar{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--border)}
.nav-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;border:none;background:none;color:var(--text-muted);cursor:pointer;transition:all .15s}
.nav-btn:hover:not(:disabled){background:var(--surface);color:var(--text)}
.nav-btn:disabled{opacity:.25;cursor:default}
.nav-btn svg{width:18px;height:18px}

.url-bar{flex:1;height:34px;display:flex;align-items:center;background:var(--url-bg);border:1px solid var(--border);border-radius:10px;padding:0 14px;margin:0 4px;transition:all .2s}
.url-bar:focus-within{border-color:var(--url-focus);box-shadow:0 0 0 3px var(--accent-bg)}
.url-icon{color:var(--text-faint);margin-right:8px;flex-shrink:0;display:flex;align-items:center}
.url-icon svg{width:14px;height:14px}
.url-icon.secure{color:var(--green)}
.url-input{flex:1;background:none;border:none;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.url-input::placeholder{color:var(--text-faint)}
.url-input::selection{background:var(--accent);color:#fff}

.profile-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:700;color:var(--accent-h);background:var(--accent-bg);margin-left:4px;flex-shrink:0;letter-spacing:.02em}
.profile-badge svg{width:14px;height:14px;flex-shrink:0}

.loading-bar{height:2px;background:transparent;position:relative;overflow:hidden}
.loading-bar.active{background:var(--bg)}
.loading-bar.active::after{content:'';position:absolute;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:loading .8s ease-in-out infinite}
@keyframes loading{0%{left:-40%}100%{left:100%}}
</style>
</head>
<body>

<div class="tab-bar" id="tabBar">
  <button class="tab-new" id="newTabBtn" title="Nova aba">+</button>
</div>

<div class="toolbar">
  <button class="nav-btn" id="backBtn" disabled title="Voltar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="nav-btn" id="forwardBtn" disabled title="Avancar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <button class="nav-btn" id="reloadBtn" title="Recarregar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
  </button>

  <div class="url-bar">
    <div class="url-icon" id="urlIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
    </div>
    <input type="text" class="url-input" id="urlInput" placeholder="Pesquisar ou digitar URL" spellcheck="false" autocomplete="off">
  </div>

  <div class="profile-badge" id="profileBadge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span id="profileName"></span>
  </div>
</div>

<div class="loading-bar" id="loadingBar"></div>

<script>
(function(){
  var urlInput = document.getElementById('urlInput');
  var urlIcon = document.getElementById('urlIcon');
  var backBtn = document.getElementById('backBtn');
  var forwardBtn = document.getElementById('forwardBtn');
  var reloadBtn = document.getElementById('reloadBtn');
  var newTabBtn = document.getElementById('newTabBtn');
  var tabBar = document.getElementById('tabBar');
  var loadingBar = document.getElementById('loadingBar');
  var profileName = document.getElementById('profileName');
  var isLoading = false;

  function normalizeUrl(input) {
    input = input.trim();
    if (!input) return '';
    if (/^https?:\/\//i.test(input)) return input;
    if (/^[a-zA-Z0-9]([a-zA-Z0-9-]*\.)+[a-zA-Z]{2,}/.test(input)) return 'https://' + input;
    return 'https://www.google.com/search?q=' + encodeURIComponent(input);
  }

  function updateUrlIcon(url) {
    if (url && url.indexOf('https://') === 0) {
      urlIcon.className = 'url-icon secure';
      urlIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>';
    } else {
      urlIcon.className = 'url-icon';
      urlIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>';
    }
  }

  urlInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var url = normalizeUrl(urlInput.value);
      if (url) window.browserAPI.navigate(url);
      urlInput.blur();
    }
  });

  urlInput.addEventListener('focus', function() {
    setTimeout(function(){ urlInput.select(); }, 0);
  });

  backBtn.addEventListener('click', function(){ window.browserAPI.goBack(); });
  forwardBtn.addEventListener('click', function(){ window.browserAPI.goForward(); });
  reloadBtn.addEventListener('click', function(){
    if (isLoading) window.browserAPI.stop();
    else window.browserAPI.reload();
  });
  newTabBtn.addEventListener('click', function(){ window.browserAPI.newTab('https://www.google.com'); });

  window.browserAPI.onUrlChanged(function(url) {
    if (document.activeElement !== urlInput) {
      urlInput.value = url || '';
    }
    updateUrlIcon(url);
  });

  window.browserAPI.onLoadingChanged(function(loading) {
    isLoading = loading;
    loadingBar.className = loading ? 'loading-bar active' : 'loading-bar';
    if (loading) {
      reloadBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      reloadBtn.title = 'Parar';
    } else {
      reloadBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>';
      reloadBtn.title = 'Recarregar';
    }
  });

  window.browserAPI.onCanGoBackChanged(function(val) {
    backBtn.disabled = !val;
  });

  window.browserAPI.onCanGoForwardChanged(function(val) {
    forwardBtn.disabled = !val;
  });

  window.browserAPI.onTabsUpdated(function(tabs, activeIdx) {
    var btns = tabBar.querySelectorAll('.tab');
    btns.forEach(function(b){ b.remove(); });
    tabs.forEach(function(tab, i) {
      var el = document.createElement('button');
      el.className = 'tab' + (i === activeIdx ? ' active' : '');
      var faviconHtml = tab.favicon
        ? '<div class="tab-favicon"><img src="'+tab.favicon+'" onerror="this.parentElement.textContent=\'🌐\'"></div>'
        : '<div class="tab-favicon">🌐</div>';
      el.innerHTML = faviconHtml + '<span class="tab-title">' + escHtml(tab.title || 'Nova aba') + '</span>' + (tabs.length > 1 ? '<button class="tab-close" data-idx="'+i+'">✕</button>' : '');
      el.addEventListener('click', function(e) {
        if (e.target.classList.contains('tab-close')) {
          window.browserAPI.closeTab(parseInt(e.target.dataset.idx));
        } else {
          window.browserAPI.switchTab(i);
        }
      });
      tabBar.insertBefore(el, newTabBtn);
    });
  });

  window.browserAPI.getProfileName().then(function(name) {
    if (name) profileName.textContent = name;
  });

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'l') { e.preventDefault(); urlInput.focus(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 't') { e.preventDefault(); window.browserAPI.newTab('https://www.google.com'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'w') { e.preventDefault(); window.browserAPI.closeTab(-1); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'r') { e.preventDefault(); window.browserAPI.reload(); }
    if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); window.browserAPI.goBack(); }
    if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); window.browserAPI.goForward(); }
  });
})();
</script>
</body>
</html>
